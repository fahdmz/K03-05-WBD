services:
  platform-db:
    image: postgres:16
    environment:
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: platform
      POSTGRES_DB: platform
    ports:
      - "5435:5432"
    volumes:
      - platform-data:/var/lib/postgresql/data

  target-db:
    image: postgres:16
    environment:
      POSTGRES_USER: target
      POSTGRES_PASSWORD: target
      POSTGRES_DB: shop
    ports:
      - "5433:5432"
    volumes:
      - target-data:/var/lib/postgresql/data

  test-db:
    image: postgres:16
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: test
    ports:
      - "5434:5432"
    tmpfs:
      - /var/lib/postgresql/data

  observability:
    image: grafana/otel-lgtm:0.41.1
    ports:
      - "3000:3000"
      - "4317:4317"
      - "4318:4318"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./observability/otelcol-config.yaml:/otel-lgtm/otelcol-config.yaml:ro
      - ./observability/grafana/provisioning/dashboards/k03-05-wbd.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/k03-05-wbd.yaml:ro
      - ./observability/grafana/dashboards:/otel-lgtm/k03-05-wbd-dashboards:ro

volumes:
  platform-data:
  target-data:
